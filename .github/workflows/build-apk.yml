name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Buscar el proyecto
        run: |
          F=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then echo "No encontré settings.gradle: faltan archivos del proyecto"; exit 1; fi
          echo "DIR=$(dirname "$F")" >> $GITHUB_ENV
      - name: Compilar
        run: cd "$DIR" && gradle assembleDebug
      - run: cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" JardinDeLara.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JardinDeLara-apk
          path: JardinDeLara.apk
